<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortLink</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <a class="brand" href="/">ShortLink</a>
      <span class="badge">Java + Spring Boot</span>
    </header>

    <section class="hero">
      <p class="eyebrow">Simple URL shortener</p>
      <h1>Make long links<br><span>short and useful.</span></h1>
      <p class="sub">Create a clean short URL, set an optional expiration date, and check how many times it was opened.</p>
    </section>

    <section class="card">
      <form id="shorten-form">
        <label for="url">Long URL</label>
        <div class="row">
          <input id="url" type="url" placeholder="https://example.com/a/very/long/link" required>
          <button type="submit" id="submit">Shorten</button>
        </div>
        <div class="options">
          <label for="expires">Expires <span>(optional)</span></label>
          <input id="expires" type="datetime-local">
        </div>
      </form>

      <p id="error" class="error" hidden></p>

      <div id="result" class="result" hidden>
        <p class="result-label">Your short link</p>
        <div class="result-row">
          <a id="short-url" target="_blank" rel="noopener"></a>
          <button id="copy" class="secondary" type="button">Copy</button>
        </div>
        <div class="details">
          <span>Code <strong id="code"></strong></span>
          <button id="stats" class="text-button" type="button">Check stats</button>
        </div>
        <div id="stats-box" class="stats-box" hidden>
          <div><strong id="clicks">0</strong><span>clicks</span></div>
          <div><strong id="created">—</strong><span>created</span></div>
          <div><strong id="expiration">Never</strong><span>expires</span></div>
        </div>
      </div>
    </section>

    <footer>Built with Spring Boot, PostgreSQL and Docker.</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
